name: Multigol Parser V1 offline

on:
  push:
    branches: ['research/multigol-parser-v1-*']
  pull_request:
    paths:
      - 'research/multigol-parser-v1/**'
      - '.github/workflows/multigol-parser-v1.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install frozen dependencies (setup only)
        run: python -m pip install -r research/multigol-parser-v1/requirements-ci.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Regenerate output schema without drift
        run: |
          python research/multigol-parser-v1/tools/build_schema.py
          git diff --exit-code -- research/multigol-parser-v1/schemas
      - name: Offline PDF, cell, CLI and backend regressions
        run: python research/multigol-parser-v1/tools/check_offline.py
