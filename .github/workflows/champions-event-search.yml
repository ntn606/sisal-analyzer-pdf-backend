name: Champions event search offline
on:
  push:
    branches: ['research/fix-champions-event-search-*']
    paths:
      - 'server.py'
      - 'tests/**'
      - 'research/champions-event-search/**'
      - '.github/workflows/champions-event-search.yml'
  pull_request:
    paths:
      - 'server.py'
      - 'tests/**'
      - 'research/champions-event-search/**'
      - '.github/workflows/champions-event-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check -r research/champions-event-search/requirements-ci.lock
      - name: Offline regression suite
        run: python research/champions-event-search/run_offline.py
