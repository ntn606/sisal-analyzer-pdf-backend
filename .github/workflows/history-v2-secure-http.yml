name: History V2 isolated offline security checks
on:
  push:
    branches: ['research/history-v2-secure-http-*']
  pull_request:
    paths: ['research/history-v2-mcp-diagnostic/**', '.github/workflows/history-v2-secure-http.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ''
      FOOTBALL_DATA_TOKEN: ''
      HISTORY_V2_MCP_TOKEN: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned CI dependencies
        run: python -m pip install -r research/history-v2-mcp-diagnostic/requirements-ci.lock
      - name: Test offline, validate JSON, scan publishable evidence
        run: python research/history-v2-mcp-diagnostic/scripts/verify_offline.py
      - name: Verify production files unchanged against base
        run: |
          git fetch --no-tags origin 6bd9b719b4e3548d05282a560ec4cb1d95297b1b
          git diff --exit-code 6bd9b719b4e3548d05282a560ec4cb1d95297b1b HEAD -- server.py requirements.txt tests
          python research/history-v2-mcp-diagnostic/scripts/review_integrity.py
